<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Universal Ninja Post Template v3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:Arial Black,"Helvetica Neue",sans-serif;display:flex;justify-content:center;padding:40px 10px}
.card{width:1200px;height:675px;background:#f2e8da;position:relative;overflow:hidden;border-radius:6px}
.visual-panel{position:absolute;inset:0 0 0 590px;background:#2b0d13;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%);}
.visual-panel:before,.visual-panel:after{content:"";position:absolute;border:2px solid #71303a;border-radius:50%}
.visual-panel:before{width:300px;height:300px;right:50px;top:50px}.visual-panel:after{width:220px;height:220px;right:10px;top:135px}
.mascot{position:absolute;z-index:2;right:18px;top:18px;width:560px;height:600px;object-fit:contain;object-position:center bottom}
.brand-row{position:absolute;z-index:3;top:42px;left:48px;display:flex;align-items:center;gap:14px}.logo-box{width:48px;height:48px;background:#1c1c1c;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#f2e8da;font-weight:900}.brand-name{font-size:42px;color:#1c1c1c;letter-spacing:.5px}
.type-pill{position:absolute;z-index:3;top:122px;left:48px;background:#d64535;color:#f2e8da;font-size:14px;letter-spacing:2px;text-transform:uppercase;padding:7px 18px;border-radius:4px}
.steps-card{position:absolute;z-index:3;top:182px;left:48px;width:620px;height:300px;background:#1c1c1c;border-radius:10px;padding:26px 30px}.steps-title{font-size:24px;color:#f2e8da;letter-spacing:.3px;margin-bottom:22px}.steps-list{position:relative;padding-left:6px}.step-line{position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:#d64535;opacity:.6}.step-item{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px;position:relative}.step-item:last-child{margin-bottom:0}.step-num{width:40px;height:40px;min-width:40px;border-radius:50%;background:#d64535;color:#f2e8da;font-size:15px;display:flex;align-items:center;justify-content:center;z-index:1;font-family:Arial,sans-serif;font-weight:700}.step-text{font-family:Arial,sans-serif;font-size:15px;color:#e5ddd0;font-weight:400;line-height:1.4;padding-top:8px}
.cta-btn{position:absolute;z-index:3;top:502px;left:358px;transform:translateX(-50%);background:#d64535;color:#f2e8da;font-size:19px;padding:13px 52px;border-radius:6px;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap}
.social-row{position:absolute;z-index:3;top:598px;left:48px;display:flex;flex-direction:column;gap:8px}.social-item{display:flex;align-items:center;gap:8px;font-family:Arial,sans-serif;font-size:12px;color:#4a4a4a;font-weight:700}.social-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="card">
  <div class="visual-panel"></div>
  <img class="mascot" src="../images/brand/anime-ninja-mascot.png" alt="Anime ninja girl mascot">
  <div class="brand-row"><div class="logo-box">M</div><div class="brand-name">MIRA</div></div>
  <div class="type-pill">Airdrop</div>
  <div class="steps-card">
    <div class="steps-title">Complete the essential steps</div>
    <div class="steps-list"><div class="step-line"></div>
      <div class="step-item"><div class="step-num">01</div><div class="step-text">Open the official project page</div></div>
      <div class="step-item"><div class="step-num">02</div><div class="step-text">Check that the campaign is active and you're eligible</div></div>
      <div class="step-item"><div class="step-num">03</div><div class="step-text">Complete only the tasks listed on the official page</div></div>
    </div>
  </div>
  <div class="cta-btn">Claim</div>
  <div class="social-row">
    <div class="social-item"><span class="social-icon">X</span><span>@CryptoVirus88</span></div>
    <div class="social-item"><span class="social-icon">➤</span><span>@janjezcrypto</span></div>
  </div>
</div>
</body>
</html>
